<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta charset="UTF-8"><title>CampuScope</title></head>
<body style="font-family: sans-serif; padding: 2rem">
  <h1>CampuScope</h1>
  <p>דף זמני. צוות 4 יחליף אותו בקוד מ-Google AI Studio.</p>
  <button onclick="check()">בדיקת חיבור לשרתים</button>
  <ul id="out"></ul>
  <script>
    const services = { "Core (8001)": 8001, "Courses (8002)": 8002, "AI (8003)": 8003 };
    async function check() {
      const out = document.getElementById("out");
      out.innerHTML = "";
      for (const [name, port] of Object.entries(services)) {
        const li = document.createElement("li");
        try {
          const r = await fetch(`http://localhost:${port}/health`);
          li.textContent = `${name}: ${r.ok ? "✅ עובד" : "❌ " + r.status}`;
        } catch (e) {
          li.textContent = `${name}: ❌ לא זמין`;
        }
        out.appendChild(li);
      }
    }
  </script>
</body>
</html>
