<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CampuScope</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background-color: #f9f9f9; }
        .bell-container { position: relative; display: inline-block; margin-bottom: 20px; }
        .bell-btn { font-size: 28px; cursor: pointer; background: none; border: none; position: relative; padding: 10px; }
        .badge { position: absolute; top: 5px; right: 5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; font-weight: bold; }
        .dropdown { display: none; position: absolute; right: 0; top: 50px; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 15px; width: 300px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000; }
        .dropdown.show { display: block; }
        .notification-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .notification-item.unread { font-weight: bold; color: #000; }
        .notification-item.read { font-weight: normal; color: #666; }
        .notification-title { margin: 0 0 5px 0; font-size: 15px; }
        .notification-msg { font-size: 13px; display: block; margin: 0; }
        
        /* עיצוב לכפתור הבדיקה הקיים */
        .health-btn { padding: 8px 16px; cursor: pointer; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>CampuScope</h1>
    <p>סביבת הפיתוח המשותפת של הפרויקט</p>

    <!-- אזור פעמון ההתראות של צוות 4 -->
    <div class="bell-container">
        <button class="bell-btn" id="bellBtn">
            🔔 <span class="badge" id="unreadBadge" style="display: none;">0</span>
        </button>
        <div class="dropdown" id="notificationsDropdown">
            <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;">התראות (צוות 4)</h4>
            <div id="notificationsList">
                טוען התראות...
            </div>
        </div>
    </div>

    <hr style="margin: 30px 0; border-top: 1px solid #ccc;">

    <!-- הקוד המקורי של בדיקת השרתים (שומרות עליו כי הוא עוזר לאינטגרציה!) -->
    <div>
        <h3>כלי מפתחים - סטטוס שרתים</h3>
        <button class="health-btn" onclick="check()">בדיקת חיבור לשרתים</button>
        <ul id="out" style="list-style-type: none; padding: 0; margin-top: 15px; font-weight: bold;"></ul>
    </div>

    <script>
        // --- קוד פעמון ההתראות (צוות 4) ---
        const bellBtn = document.getElementById('bellBtn');
        const dropdown = document.getElementById('notificationsDropdown');
        const unreadBadge = document.getElementById('unreadBadge');
        const notificationsList = document.getElementById('notificationsList');

        bellBtn.addEventListener('click', () => {
            dropdown.classList.toggle('show');
        });

        fetch('http://localhost:8001/notifications')
            .then(response => response.json())
            .then(data => {
                notificationsList.innerHTML = ''; 
                
                const unreadCount = data.filter(n => !n.is_read).length;
                if (unreadCount > 0) {
                    unreadBadge.textContent = unreadCount;
                    unreadBadge.style.display = 'block';
                }

                if (data.length === 0) {
                    notificationsList.innerHTML = '<p style="font-size: 14px; color: #666;">אין התראות חדשות</p>';
                    return;
                }

                data.forEach(n => {
                    const div = document.createElement('div');
                    div.className = `notification-item ${n.is_read ? 'read' : 'unread'}`;
                    div.innerHTML = `
                        <p class="notification-title">${n.title}</p>
                        <p class="notification-msg">${n.message}</p>
                    `;
                    notificationsList.appendChild(div);
                });
            })
            .catch(err => {
                console.error('Error fetching notifications:', err);
                notificationsList.innerHTML = '<p style="color: red; font-size: 14px;">שגיאה בחיבור לשרת ההתראות</p>';
            });

        // --- הקוד המקורי של בדיקת השרתים ---
        const services = { "Core (8001)": 8001, "Courses (8002)": 8002, "AI (8003)": 8003 };
        async function check() {
            const out = document.getElementById("out");
            out.innerHTML = "";
            for (const [name, port] of Object.entries(services)) {
                const li = document.createElement("li");
                try {
                    const r = await fetch(`http://localhost:${port}/health`);
                    li.textContent = `${name}: ${r.ok ? "✅ עובד" : "❌ " + r.status}`;
                } catch (e) {
                    li.textContent = `${name}: ❌ לא זמין`;
                }
                out.appendChild(li);
            }
        }
    </script>
</body>
</html>
